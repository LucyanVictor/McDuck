<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>McDuck</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-title" content="McDuck">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<div id="tela-config" class="centro hidden">
  <div class="cartao auth">
    <div class="logo-auth"><img src="logo.svg" class="logo-img" alt=""> <span class="marca"><b>Mc</b>Duck</span></div>
    <h2>Falta configurar</h2>
    <p class="sub">Abra o arquivo <code>config.js</code> e preencha a URL e a chave do seu projeto Supabase (Project Settings › API).</p>
  </div>
</div>

<div id="tela-login" class="centro hidden">
  <form id="form-login" class="cartao auth">
    <div id="login-masc" class="login-masc"></div>
    <div class="logo-auth"><img src="logo.svg" class="logo-img" alt=""> <span class="marca"><b>Mc</b>Duck</span></div>
    <p class="sub" id="auth-sub">Entre na sua conta</p>
    <label id="campo-nome" class="hidden">Seu nome<input name="nome" autocomplete="name"></label>
    <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
    <label>Senha<input type="password" name="senha" required minlength="6" autocomplete="current-password"></label>
    <button type="submit" class="btn pri largo" id="btn-auth">Entrar</button>
    <p class="msg" id="auth-msg"></p>
    <p class="alterna hidden"><button type="button" class="lnk" id="link-alterna">Não tem conta? Cadastre-se</button></p>
    <p class="alterna hidden"><button type="button" class="lnk" id="link-esqueci">Esqueci minha senha</button></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="side"></aside>
  <div id="overlay" data-a="menu"></div>
  <div id="principal">
    <div id="topo"></div>
    <main id="conteudo"></main>
  </div>
</div>

<dialog id="modal"></dialog>
<div id="toast"></div>

<script src="core.js"></script>
<script src="pages1.js"></script>
<script src="pages2.js"></script>
<script src="pages3.js"></script>
<script src="app.js"></script>
</body>
</html>
